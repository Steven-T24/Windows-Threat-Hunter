<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Windows Threat Hunter Web</title>
    <!-- Main dark-mode CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Windows Threat Hunter</h1>

    <!-- Form section -->
    <form method="post">
        <label for="mode">Mode:</label>
        <select name="mode" id="mode">
            <option value="lookup">Process Lookup</option>
            <option value="dll">DLL Lookup</option>
            <option value="chain">Attack Chain</option>
        </select><br><br>

        <label for="user_input">Input (multi-line allowed):</label><br>
        <textarea name="user_input" rows="8"></textarea><br><br>

        <input type="submit" value="Run">
    </form>

    <!-- Output section -->
    {% if output %}
        <h2>Output</h2>
        <div class="output">
            {{ output | safe }}
        </div>
    {% endif %}

    <!-- Result section -->
    {% if result %}
        <h2>Result</h2>
        <div class="output">
            <pre>{{ result | safe }}</pre>
        </div>
    {% endif %}
</body>
</html>
